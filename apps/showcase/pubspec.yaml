name: showcase
description: Flutter reference app for the MileSoft Starter Kit.
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.11.1
  milesoft_core: ^0.1.0
  milesoft_ui: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
